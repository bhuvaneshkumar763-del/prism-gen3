# Weekly update PRs for npm packages and the pinned GitHub Actions. Minor and
# patch updates come grouped into one PR each, so they don't pile up; major
# versions come one PR each, since they can break things.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
