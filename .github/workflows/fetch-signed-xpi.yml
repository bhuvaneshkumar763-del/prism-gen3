# Attaches Mozilla's signed .xpi to an existing GitHub release, for when the
# Release workflow shipped the unsigned zip because approval was still pending.
# The version is already submitted, so this only downloads; it never re-submits.
# Run it by hand from the Actions tab with the release version.
name: Fetch signed Firefox XPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.3.2-beta.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The version reaches the script through env (never the shell command),
      # and the script validates it. Exit 2 means Mozilla hasn't approved it
      # yet: reported as a notice, not a failure.
      - name: Download the approved XPI from Mozilla
        id: fetch
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ inputs.version }}
          OUT_DIR: signed
        run: |
          set +e
          node scripts/fetch-signed-xpi.mjs
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::notice::Mozilla hasn't approved this version yet. Run this again later."
            exit 0
          fi
          exit "$code"

      - name: Attach it to the GitHub release
        if: steps.fetch.outputs.xpi != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          XPI: ${{ steps.fetch.outputs.xpi }}
        # The unsigned zip was only a stand-in; with it gone, the release has one Firefox file.
        run: |
          gh release upload "v$VERSION" "$XPI" --clobber --repo "$GITHUB_REPOSITORY"
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | { grep -- '-firefox\.zip$' || true; } \
            | while read -r name; do gh release delete-asset "v$VERSION" "$name" --yes --repo "$GITHUB_REPOSITORY"; done
