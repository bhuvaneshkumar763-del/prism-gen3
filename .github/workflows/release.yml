name: Release

# Gen 3 plan, Session 9: triggered by CI's own completion, not
# independently on push — keeps a broken build from ever getting
# auto-released just because package.json changed. Whether this run
# actually needs to do anything (i.e. whether the version changed) is
# decided inside the job via `gh release view`, so it's safe to fire on
# every CI completion rather than only on version-bump commits.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  release:
    # CI's workflow_run event fires once per underlying trigger (push or
    # pull_request); restricting to the push-triggered run avoids two
    # Release jobs racing to create the same tag when a PR is open against
    # main at the same time a direct push lands.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The exact commit CI just verified, not necessarily the branch
          # tip (which may have moved on by the time this job starts).
          ref: ${{ github.event.workflow_run.head_sha }}

      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: npm ci

      - name: Build + package Chrome
        if: steps.check.outputs.exists == 'false'
        run: npm run zip

      - name: Build + package Firefox
        if: steps.check.outputs.exists == 'false'
        run: npm run zip:firefox

      - name: Extract this version's changelog section
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -f CHANGELOG.md ]; then
            awk -v ver="## $VERSION" 'index($0, ver) == 1 { found=1; next } found && /^## / { exit } found' CHANGELOG.md > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then echo "(No changelog entry found for $VERSION.)" > release-notes.md; fi

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PRERELEASE_FLAG=()
          # A semver prerelease (e.g. 0.2.0-beta.0) always ships as a GitHub
          # prerelease — just labels the GitHub Release itself so it doesn't
          # show up as "Latest", independent of any store review channel.
          if [[ "$VERSION" == *-* ]]; then PRERELEASE_FLAG=(--prerelease); fi
          gh release create "v$VERSION" \
            .output/*-chrome.zip .output/*-firefox.zip \
            --title "Prism (Gen 3) v$VERSION" \
            --notes-file release-notes.md \
            --target "${{ github.event.workflow_run.head_sha }}" \
            "${PRERELEASE_FLAG[@]}"
