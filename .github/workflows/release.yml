name: Release

# Runs after CI passes on a push to main, so a broken build is never released.
# Whether there is anything to release (a version with no GitHub Release yet)
# is decided inside the job, so it is safe to run on every CI completion.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    # Only the push-triggered CI run, so a PR's CI run can't race it for the tag.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # A step's `if:` can't read secrets directly; both are needed to sign.
      HAS_AMO_KEYS: ${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The exact commit CI verified, not the branch tip.
          ref: ${{ github.event.workflow_run.head_sha }}
          # Keep the write token out of .git/config while npm ci runs install scripts.
          persist-credentials: false

      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Before anything is installed or built, so a refused release costs no
      # build or signing request. Fails unless the version's changelog entry has
      # a "Checked on: <page>, <browser>, <date>" line (fix-plan.md rule 3); then
      # add the line and push again. Also trims notes to GitHub's size limit.
      - name: Release notes and real-page check
        if: steps.check.outputs.exists == 'false'
        run: node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" "${{ github.repository }}" release-notes.md

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: npm ci

      - name: Build + package Chrome
        if: steps.check.outputs.exists == 'false'
        run: npm run zip

      - name: Build + package Firefox
        if: steps.check.outputs.exists == 'false'
        run: npm run zip:firefox

      # Firefox only installs signed add-ons. Unlisted: no public listing.
      # A signing failure must not stop the release, so the next step and the
      # release step fall back as needed. The 45-minute wait covers Mozilla's
      # slow days; web-ext comes from the lockfile, not a fresh npx download.
      - name: Sign Firefox add-on (AMO)
        id: sign
        if: steps.check.outputs.exists == 'false' && env.HAS_AMO_KEYS == 'true'
        continue-on-error: true
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --no-install web-ext sign \
            --source-dir=.output/firefox-mv2 \
            --artifacts-dir=web-ext-artifacts \
            --channel=unlisted \
            --approval-timeout=2700000

      # When signing produced nothing (for example "version already exists"
      # after a re-run, or a timeout), Mozilla may already hold a signed copy of
      # this version: download it instead of shipping the unsigned zip.
      - name: Fetch an already-signed Firefox add-on
        if: steps.check.outputs.exists == 'false' && env.HAS_AMO_KEYS == 'true' && hashFiles('web-ext-artifacts/*.xpi') == ''
        continue-on-error: true
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ steps.version.outputs.version }}
          OUT_DIR: web-ext-artifacts
        run: node scripts/fetch-signed-xpi.mjs

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A semver prerelease (0.3.2-beta.0) is marked as a GitHub prerelease.
          PRERELEASE_FLAG=()
          if [[ "$VERSION" == *-* ]]; then PRERELEASE_FLAG=(--prerelease); fi

          # The signed .xpi when there is one; otherwise the unsigned zip.
          FIREFOX_ASSET=(.output/*-firefox.zip)
          shopt -s nullglob
          SIGNED=(web-ext-artifacts/*.xpi)
          if [ ${#SIGNED[@]} -gt 0 ]; then FIREFOX_ASSET=("${SIGNED[@]}"); fi
          shopt -u nullglob
          if [ ${#SIGNED[@]} -eq 0 ] && [ "$HAS_AMO_KEYS" = "true" ]; then
            echo "::warning::No signed Firefox add-on yet; shipping the unsigned zip. Run 'Fetch signed Firefox XPI' once Mozilla approves."
          fi

          gh release create "v$VERSION" \
            .output/*-chrome.zip "${FIREFOX_ASSET[@]}" \
            --title "Prism (Gen 3) v$VERSION" \
            --notes-file release-notes.md \
            --target "${{ github.event.workflow_run.head_sha }}" \
            "${PRERELEASE_FLAG[@]}"
