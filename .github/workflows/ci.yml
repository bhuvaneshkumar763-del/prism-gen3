name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Every step is a gate. Lint warnings don't fail it; errors do.
      - name: Typecheck
        run: npm run compile

      - name: Lint
        run: npm run lint

      # src/engine and src/shared must not use browser APIs (src/engine/README.md).
      - name: Engine-purity guard
        run: npm run guard:engine-purity

      # A configStore.get() read outside a reactive scope never re-renders.
      - name: Solid-reactivity guard
        run: npm run guard:solid-reactivity

      # Coverage limits per folder are in vitest.config.ts.
      - name: Unit tests + coverage gate
        run: npm run test:coverage

      - name: Build extension
        run: npm run build

      # The Xcode project builds from a committed copy of the Safari build, so
      # it must match the code. Fix a failure with `npm run safari:sync`.
      - name: Safari copy is up to date
        run: |
          npm run safari:sync
          git diff --exit-code --stat -- safari/ || { echo "::error::The Safari copy in safari/ is out of date. Run 'npm run safari:sync' and commit."; exit 1; }
          test -z "$(git status --porcelain -- safari/)" || { echo "::error::npm run safari:sync added files under safari/. Run it locally and commit them."; git status --porcelain -- safari/; exit 1; }

      # Both builds, total and largest file; limits in scripts/check-bundle-size.mjs.
      - name: Build Firefox extension (for the size check)
        run: npm run build:firefox

      - name: Bundle-size guardrail
        run: npm run guard:bundle-size

      # Full Chrome with --headless=new: chrome-headless-shell can't load extensions.
      - name: E2E smoke test
        run: npm run test:e2e

      # Saved pages translated with Google's recorded answers, no network.
      - name: Page replay tests
        run: npm run test:replay

      - name: Zip extension
        run: npm run zip

      - name: Upload Chrome zip artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prism-gen3-chrome
          path: .output/*-chrome.zip

  build-firefox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Firefox extension
        run: npm run build:firefox

      - name: Zip Firefox extension
        run: npm run zip:firefox

      - name: Upload Firefox zip artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prism-gen3-firefox
          path: .output/*-firefox.zip
