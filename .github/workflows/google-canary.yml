# Early warning for the free Google endpoint, the one dependency Prism can't
# control. Translates one sentence through the real provider every day; a red
# run (GitHub emails you about failed scheduled runs) means Google changed
# something, before it shows up as an untranslated chapter. If it fails, the
# Google Cloud provider in Settings is the backup.
name: Google canary

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Translate one sentence through free Google
        run: npm run test:live
