# Early warning for the free Google endpoint, the one dependency Prism can't
# control. Translates one sentence through the real provider every day; a red
# run (GitHub emails you about failed scheduled runs) means Google changed
# something, before it shows up as an untranslated chapter. If it fails, the
# Google Cloud provider in Settings is the backup.
name: Google canary

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Translate one sentence through free Google
        run: npm run test:live
