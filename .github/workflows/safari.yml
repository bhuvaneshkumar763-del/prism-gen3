# Builds the Safari app (macOS, and iOS for the simulator) from the committed
# Xcode project, without code signing. Signing and App Store distribution need
# the owner's Apple account and are not done here; see safari/README.md.
name: Safari

on:
  push:
    branches: [main]
    paths: ['safari/**', 'src/**', 'entrypoints/**', 'components/**', 'package.json', '.github/workflows/safari.yml']
  pull_request:
    paths: ['safari/**', 'src/**', 'entrypoints/**', 'components/**', 'package.json', '.github/workflows/safari.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xcode:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Prism (macOS)
            sdk: macosx
          - target: Prism (iOS)
            sdk: iphonesimulator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The project file was saved by a recent Xcode; use the newest installed.
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build ${{ matrix.target }}
        run: |
          xcodebuild build \
            -project safari/Prism/Prism.xcodeproj \
            -target "${{ matrix.target }}" \
            -sdk ${{ matrix.sdk }} \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
