<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="prism-diagnostics"><style>body{font:16px/1.6 -apple-system,sans-serif}</style></head>
<body>
<p class="c">这是内嵌框架里的文字，它应该和外层页面一起被翻译，也一起恢复原文。</p>
<p class="c">如果这段文字仍然是中文，说明框架没有被翻译。</p>
<script>
  // Counts the top frame's "decision ready" signals reaching this frame.
  window.__prismSyncs = 0;
  window.addEventListener('message', (event) => {
    if (event.data?.prismFrameSync === true) window.__prismSyncs++;
  });
</script>
</body>
</html>
