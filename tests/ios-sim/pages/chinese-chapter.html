<h1>第十二章 夜雨</h1>
<p class="c">夜深了，雨还在下。他独自坐在窗前，望着远处模糊的灯火，久久没有说话。</p>
<p class="c">门外传来轻轻的脚步声，一个熟悉的声音问道：“你还没睡吗？”</p>
<p class="c">他回过头，看见师妹撑着一把旧伞站在门口，衣角已经被雨水打湿。</p>
<p class="c">“明天就要出发了，”她低声说，“我只是想再看看你。”</p>
<p class="c">他沉默了一会儿，终于点了点头，让她进屋坐下。</p>
<p class="c">（本章完）</p>
